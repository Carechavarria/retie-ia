<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0f2e45"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>RETIE.IA</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="logo.png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1a7abf;
      --blue-light: #d6edf9;
      --teal: #1D9E75;
      --teal-light: #d4f2ea;
      --dark: #0f2e45;
      --dark2: #0d2438;
      --white: #ffffff;
      --gray-text: rgba(255,255,255,0.7);
      --gray-muted: rgba(255,255,255,0.35);
      --border: rgba(255,255,255,0.08);
      --bg: #f4f7fa;
      --bubble-ai: #ffffff;
      --text: #1a2a3a;
      --text-muted: #5a7080;
      --border-light: #e0e8ef;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── LAYOUT PRINCIPAL ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      height: 100vh;
    }

    /* ── TOPBAR ── */
    #topbar {
      background: var(--dark);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #menu-btn {
      width: 36px; height: 36px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 4px;
      border-radius: 6px;
    }
    #menu-btn span {
      display: block;
      width: 20px; height: 2px;
      background: var(--white);
      border-radius: 2px;
      transition: all 0.2s;
    }

    #logo-wrap {
      width: 30px; height: 30px;
      border-radius: 6px;
      overflow: hidden;
      background: transparent;
    }
    #logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

    #app-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.03em;
    }
    #app-name span { color: var(--teal); }

    #web-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid rgba(29,158,117,0.5);
      background: rgba(29,158,117,0.15);
      cursor: pointer;
      font-size: 12px;
      color: #5DCAA5;
      transition: all 0.2s;
    }
    #web-toggle-btn.off {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: var(--gray-muted);
    }
    .web-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--teal);
      transition: background 0.2s;
    }
    #web-toggle-btn.off .web-dot { background: rgba(255,255,255,0.3); }

    /* ── ACCENT BAR ── */
    .accent-bar {
      height: 3px;
      display: flex;
      flex-shrink: 0;
    }
    .accent-bar .a1 { flex: 1; background: var(--blue); }
    .accent-bar .a2 { width: 30%; background: var(--teal); }

    /* ── BODY: SIDEBAR + MAIN ── */
    #body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ── OVERLAY ── */
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 10;
    }
    #overlay.open { display: block; }

    /* ── SIDEBAR ── */
    #sidebar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      background: var(--dark);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      overflow: hidden;
    }
    #sidebar.open { transform: translateX(0); }

    .sb-section {
      padding: 14px 14px 5px;
      font-size: 10px;
      font-weight: 600;
      color: var(--gray-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #docs-list { padding: 0 8px; }
    #queries-list { flex: 1; overflow-y: auto; padding: 0 8px; }

    .doc-item, .query-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }
    .doc-item:active, .query-item:active { background: rgba(255,255,255,0.1); }
    .doc-item.active { background: rgba(26,122,191,0.3); }
    .query-item.active { background: rgba(29,158,117,0.2); }

    .doc-badge {
      width: 26px; height: 26px;
      border-radius: 6px;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700;
      color: var(--blue-light);
      flex-shrink: 0;
    }
    .doc-name, .q-label {
      font-size: 13px;
      color: var(--gray-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .doc-item.active .doc-name,
    .query-item.active .q-label { color: var(--white); }

    .q-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--teal);
      flex-shrink: 0;
    }

    .del-btn {
      width: 26px; height: 26px;
      border-radius: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.15s, background 0.15s;
      padding: 0;
    }
    .del-btn:active { opacity: 1; background: rgba(226,75,74,0.2); }

    .upload-btn {
      margin: 6px 10px 4px;
      padding: 10px;
      border: 1px dashed rgba(29,158,117,0.4);
      border-radius: 8px;
      font-size: 13px;
      color: var(--teal);
      cursor: pointer;
      text-align: center;
      background: transparent;
      width: calc(100% - 20px);
      transition: background 0.15s;
    }
    .upload-btn:active { background: rgba(29,158,117,0.1); }

    .new-q-btn {
      margin: 8px 10px 12px;
      padding: 12px;
      background: var(--teal);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: calc(100% - 20px);
      transition: opacity 0.15s;
      letter-spacing: 0.02em;
    }
    .new-q-btn:active { opacity: 0.85; }

    /* ── MAIN CHAT ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    #query-title-bar {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-light);
      background: var(--white);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }

    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      padding: 40px 20px;
      text-align: center;
    }
    .empty-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--blue-light);
      display: flex; align-items: center; justify-content: center;
    }

    /* ── BURBUJAS ── */
    .msg-user {
      align-self: flex-end;
      background: var(--dark);
      color: var(--blue-light);
      padding: 11px 15px;
      border-radius: 18px 18px 4px 18px;
      font-size: 14px;
      max-width: 80%;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-ai {
      align-self: flex-start;
      max-width: 95%;
    }

    .ai-bubble {
      background: var(--bubble-ai);
      border: 1px solid var(--border-light);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 15px;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .ai-bubble p { margin-bottom: 8px; }
    .ai-bubble p:last-child { margin-bottom: 0; }

    .def-box {
      border-left: 3px solid var(--blue);
      border-radius: 0 8px 8px 0;
      padding: 10px 12px;
      background: var(--blue-light);
      margin: 8px 0;
    }
    .def-term { font-size: 13px; font-weight: 600; color: #0C447C; margin-bottom: 4px; }
    .def-text { font-size: 13px; color: #185FA5; line-height: 1.5; }

    .formula-box {
      background: var(--dark);
      border-radius: 8px;
      padding: 11px 14px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #85B7EB;
      margin: 8px 0;
      border-left: 3px solid var(--teal);
      overflow-x: auto;
      white-space: nowrap;
    }

    .result-table-wrap { overflow-x: auto; margin: 8px 0; border-radius: 8px; }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 280px;
    }
    .result-table th {
      background: var(--dark);
      color: #B5D4F4;
      padding: 9px 11px;
      font-weight: 600;
      text-align: left;
    }
    .result-table th:first-child { border-radius: 8px 0 0 0; }
    .result-table th:last-child { border-radius: 0 8px 0 0; }
    .result-table td {
      border-bottom: 1px solid var(--border-light);
      padding: 8px 11px;
      color: var(--text);
    }
    .result-table tr:nth-child(even) td { background: #f0f6fb; }
    .result-table tr:last-child td { border-bottom: none; }

    .source-strip { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px; font-weight: 600;
      border: 1px solid;
    }
    .tag-doc { background: var(--blue-light); color: #0C447C; border-color: #85B7EB; }
    .tag-web { background: var(--teal-light); color: #085041; border-color: #5DCAA5; }

    /* ── TYPING ── */
    .typing-anim { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .typing-anim span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--blue);
      animation: blink 1.2s infinite;
    }
    .typing-anim span:nth-child(2) { animation-delay: 0.2s; }
    .typing-anim span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

    /* ── INPUT ── */
    #input-wrap {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--border-light);
      background: var(--white);
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    #chat-input {
      flex: 1;
      border: 1px solid var(--border-light);
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 46px;
      max-height: 120px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.4;
    }
    #chat-input:focus { border-color: var(--blue); background: var(--white); }

    #send-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:active { background: var(--teal); transform: scale(0.94); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <div id="topbar-left">
      <button id="menu-btn" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div id="logo-wrap">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'"/>
      </div>
      <div id="app-name">RETIE<span>.IA</span></div>
    </div>
    <button id="web-toggle-btn" onclick="toggleWeb()">
      <div class="web-dot"></div>
      <span id="web-label">Web</span>
    </button>
  </div>

  <div class="accent-bar"><div class="a1"></div><div class="a2"></div></div>

  <div id="body">
    <div id="overlay" onclick="closeSidebar()"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sb-section">Documentos</div>
      <div id="docs-list"></div>
      <button class="upload-btn" onclick="doUpload()">+ Subir PDF</button>

      <div class="sb-section" style="margin-top:10px;">Consultas</div>
      <div id="queries-list"></div>

      <button class="new-q-btn" onclick="newQ(); closeSidebar()">+ Nueva consulta</button>
    </div>

    <!-- MAIN -->
    <div id="main">
      <div id="query-title-bar" id="query-title">Selecciona o crea una consulta</div>
      <div id="chat-area">
        <div class="empty-state">
          <div class="empty-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a7abf" stroke-width="1.8"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          </div>
          <div>
            <div style="font-weight:600;color:#1a2a3a;margin-bottom:4px;">Bienvenido a RETIE.IA</div>
            <div>Toca el menú ☰ para subir un PDF y comenzar a consultarlo</div>
          </div>
        </div>
      </div>
      <div id="input-wrap">
        <div class="input-row">
          <textarea id="chat-input" rows="1" placeholder="Escribe tu consulta técnica..."></textarea>
          <button id="send-btn" onclick="sendMsg()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const ICON_X = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#E24B4A" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="12" y2="12"/><line x1="12" y1="2" x2="2" y2="12"/></svg>`;
const ICON_DOC = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
const ICON_WEB = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;

let docs = [];
let qs = [];
let curQ = -1;
let webOn = true;
let busy = false;

// ── SIDEBAR ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── WEB TOGGLE ──
function toggleWeb() {
  webOn = !webOn;
  const btn = document.getElementById('web-toggle-btn');
  const lbl = document.getElementById('web-label');
  btn.classList.toggle('off', !webOn);
  lbl.textContent = webOn ? 'Web' : 'Sin web';
}

// ── DOCUMENTOS ──
function renderDocs() {
  const list = document.getElementById('docs-list');
  list.innerHTML = '';
  if (docs.length === 0) {
    list.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:rgba(255,255,255,0.3);font-style:italic;">Sin documentos cargados</div>';
    return;
  }
  docs.forEach((d, i) => {
    const item = document.createElement('div');
    item.className = 'doc-item' + (i === 0 ? ' active' : '');
    item.innerHTML = `<div class="doc-badge">PDF</div><span class="doc-name">${d.name}</span>
      <button class="del-btn" onclick="delDoc(event,${i})">${ICON_X}</button>`;
    item.onclick = (e) => { if (!e.target.closest('.del-btn')) { document.querySelectorAll('.doc-item').forEach(x => x.classList.remove('active')); item.classList.add('active'); } };
    list.appendChild(item);
  });
}

function delDoc(e, i) {
  e.stopPropagation();
  const name = docs[i].name;
  docs.splice(i, 1);
  renderDocs();
  showToast(`"${name.substring(0, 22)}" eliminado`);
}

function doUpload() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.pdf';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const name = f.name.replace('.pdf', '');
    docs.push({ name, file: f });
    renderDocs();
    showToast(`"${name.substring(0, 22)}" cargado`);
    closeSidebar();
  };
  inp.click();
}

// ── CONSULTAS ──
function renderQueries() {
  const list = document.getElementById('queries-list');
  list.innerHTML = '';
  if (qs.length === 0) {
    list.innerHTML = '<div style="padding:8px 12px;font-size:12px;color:rgba(255,255,255,0.3);font-style:italic;">Sin consultas aún</div>';
    return;
  }
  qs.forEach((q, i) => {
    const item = document.createElement('div');
    item.className = 'query-item' + (i === curQ ? ' active' : '');
    item.innerHTML = `<div class="q-dot"></div><span class="q-label">${q.title}</span>
      <button class="del-btn" onclick="delQ(event,${i})">${ICON_X}</button>`;
    item.onclick = (e) => { if (!e.target.closest('.del-btn')) { loadQ(i); closeSidebar(); } };
    list.appendChild(item);
  });
}

function loadQ(i) {
  curQ = i;
  document.getElementById('query-title-bar').textContent = qs[i].title;
  renderQueries();
  renderMsgs(qs[i].msgs);
}

function delQ(e, i) {
  e.stopPropagation();
  qs.splice(i, 1);
  if (qs.length === 0) {
    curQ = -1;
    document.getElementById('query-title-bar').textContent = 'Selecciona o crea una consulta';
    document.getElementById('chat-area').innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a7abf" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span>Crea una nueva consulta para comenzar</span></div>`;
  } else {
    if (curQ >= qs.length) curQ = qs.length - 1;
    loadQ(curQ);
  }
  renderQueries();
  showToast('Consulta eliminada');
}

function newQ() {
  const idx = qs.length;
  qs.push({ title: 'Nueva consulta ' + (idx + 1), msgs: [] });
  curQ = idx;
  renderQueries();
  document.getElementById('query-title-bar').textContent = qs[idx].title;
  document.getElementById('chat-area').innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a7abf" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span>Escribe tu primera pregunta abajo</span></div>`;
  document.getElementById('chat-input').focus();
}

// ── RENDER MENSAJES ──
function renderMsgs(msgs) {
  const area = document.getElementById('chat-area');
  area.innerHTML = '';
  if (!msgs || msgs.length === 0) {
    area.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a7abf" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span>Escribe tu primera pregunta abajo</span></div>`;
    return;
  }
  msgs.forEach(m => {
    if (m.role === 'user') {
      const d = document.createElement('div');
      d.className = 'msg-user'; d.textContent = m.text;
      area.appendChild(d);
    } else {
      const wrap = document.createElement('div'); wrap.className = 'msg-ai';
      const bub = document.createElement('div'); bub.className = 'ai-bubble';
      buildBubble(bub, m);
      wrap.appendChild(bub); area.appendChild(wrap);
    }
  });
  area.scrollTop = area.scrollHeight;
}

function buildBubble(bub, m) {
  if (m.type === 'def') {
    const box = document.createElement('div'); box.className = 'def-box';
    box.innerHTML = `<div class="def-term">${m.term}</div><div class="def-text">${m.def}</div>`;
    bub.appendChild(box);
  } else if (m.type === 'formula') {
    const l = document.createElement('p'); l.textContent = m.label; bub.appendChild(l);
    const f = document.createElement('div'); f.className = 'formula-box'; f.textContent = m.formula; bub.appendChild(f);
  } else if (m.type === 'table') {
    const wrap = document.createElement('div'); wrap.className = 'result-table-wrap';
    const tbl = document.createElement('table'); tbl.className = 'result-table';
    const thead = document.createElement('thead'); const hr = document.createElement('tr');
    m.headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
    thead.appendChild(hr); tbl.appendChild(thead);
    const tbody = document.createElement('tbody');
    m.rows.forEach(row => { const tr = document.createElement('tr'); row.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }); tbody.appendChild(tr); });
    tbl.appendChild(tbody); wrap.appendChild(tbl); bub.appendChild(wrap);
  } else if (m.type === 'text') {
    const p = document.createElement('p'); p.textContent = m.text; bub.appendChild(p);
  }
  if (m.srcs && m.srcs.length) {
    const strip = document.createElement('div'); strip.className = 'source-strip';
    m.srcs.forEach(s => {
      const t = document.createElement('span'); t.className = `tag-pill ${s === 'doc' ? 'tag-doc' : 'tag-web'}`;
      t.innerHTML = (s === 'doc' ? ICON_DOC : ICON_WEB) + (s === 'doc' ? ' Documento' : ' Web');
      strip.appendChild(t);
    });
    bub.appendChild(strip);
  }
}

// ── INPUT ──
const chatInput = document.getElementById('chat-input');
chatInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
chatInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

// ── ENVIAR MENSAJE ──
async function sendMsg() {
  const text = chatInput.value.trim();
  if (!text || busy) return;
  chatInput.value = ''; chatInput.style.height = 'auto';

  if (curQ === -1) { newQ(); }

  const area = document.getElementById('chat-area');
  qs[curQ].msgs.push({ role: 'user', text });
  if (area.querySelector('.empty-state')) area.innerHTML = '';

  const uDiv = document.createElement('div'); uDiv.className = 'msg-user'; uDiv.textContent = text;
  area.appendChild(uDiv); area.scrollTop = area.scrollHeight;

  const short = text.length > 45 ? text.substring(0, 43) + '…' : text;
  document.getElementById('query-title-bar').textContent = short;
  qs[curQ].title = short;
  renderQueries();

  busy = true;
  const tw = document.createElement('div'); tw.className = 'msg-ai';
  const tb = document.createElement('div'); tb.className = 'ai-bubble';
  tb.innerHTML = `<div class="typing-anim"><span></span><span></span><span></span></div>`;
  tw.appendChild(tb); area.appendChild(tw); area.scrollTop = area.scrollHeight;

  try {
    const sys = `Eres RETIE.IA, asistente técnico experto en ingeniería eléctrica y normativa RETIE colombiana. Responde SOLO en JSON puro sin markdown ni texto extra:
{"blocks":[...]}
Bloques permitidos:
- {"type":"text","content":"..."}
- {"type":"def","term":"...","def":"..."}
- {"type":"formula","label":"...","formula":"..."}
- {"type":"table","headers":[...],"rows":[[...],...]}
- {"type":"websrc","note":"..."}
Máximo 4 bloques. Sé técnico, claro y preciso. Siempre en español.`;

    const wn = webOn ? ' (si el documento no cubre el tema, complementa con información técnica actualizada de la web)' : '';
    const userContent = `Consulta del ingeniero: "${text}"${wn}. Responde como si tuvieras acceso al documento técnico cargado por el usuario.`;

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
          'Content-Type': 'application/json',
          'x-api-key': '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',
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-iab': 'true'
        },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: sys,
        messages: [{ role: 'user', content: userContent }]
      })
    });

    const data = await resp.json();
    const raw = data.content.map(c => c.text || '').join('');
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    tw.remove();

    const aw = document.createElement('div'); aw.className = 'msg-ai';
    const ab = document.createElement('div'); ab.className = 'ai-bubble';
    let srcs = ['doc'];

    parsed.blocks.forEach(b => {
      if (b.type === 'text') { const p = document.createElement('p'); p.textContent = b.content; ab.appendChild(p); }
      else if (b.type === 'def') { const box = document.createElement('div'); box.className = 'def-box'; box.innerHTML = `<div class="def-term">${b.term}</div><div class="def-text">${b.def}</div>`; ab.appendChild(box); }
      else if (b.type === 'formula') { const l = document.createElement('p'); l.textContent = b.label; ab.appendChild(l); const f = document.createElement('div'); f.className = 'formula-box'; f.textContent = b.formula; ab.appendChild(f); }
      else if (b.type === 'table') {
        const wrap = document.createElement('div'); wrap.className = 'result-table-wrap';
        const tbl = document.createElement('table'); tbl.className = 'result-table';
        const thead = document.createElement('thead'); const hr = document.createElement('tr');
        b.headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; hr.appendChild(th); });
        thead.appendChild(hr); tbl.appendChild(thead);
        const tbody = document.createElement('tbody');
        b.rows.forEach(row => { const tr = document.createElement('tr'); row.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }); tbody.appendChild(tr); });
        tbl.appendChild(tbody); wrap.appendChild(tbl); ab.appendChild(wrap);
      } else if (b.type === 'websrc') {
        srcs = ['doc', 'web'];
        const p = document.createElement('p'); p.style.cssText = 'font-size:12px;color:#5a7080;margin-top:4px;'; p.textContent = b.note; ab.appendChild(p);
      }
    });

    const strip = document.createElement('div'); strip.className = 'source-strip';
    srcs.forEach(s => {
      const t = document.createElement('span'); t.className = `tag-pill ${s === 'doc' ? 'tag-doc' : 'tag-web'}`;
      t.innerHTML = (s === 'doc' ? ICON_DOC : ICON_WEB) + (s === 'doc' ? ' Documento' : ' Web');
      strip.appendChild(t);
    });
    ab.appendChild(strip); aw.appendChild(ab); area.appendChild(aw);

  } catch (err) {
    tw.remove();
    const ew = document.createElement('div'); ew.className = 'msg-ai';
    const eb = document.createElement('div'); eb.className = 'ai-bubble';
    eb.textContent = 'Error al procesar. Verifica tu conexión e intenta de nuevo.';
    ew.appendChild(eb); area.appendChild(ew);
  }

  busy = false;
  area.scrollTop = area.scrollHeight;
}

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

renderDocs();
renderQueries();
</script>
